# Codespaces only. Codespaces fails to forward port 80, so Apache also serves
# the app on 8080 (same port as local Docker) and proxies phpMyAdmin on 8081.
<IfModule !proxy_module>
  LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
  LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so
</IfModule>

Listen 8080
<VirtualHost *:8080>
  DocumentRoot /var/www/html
</VirtualHost>

Listen 8081
<VirtualHost *:8081>
  ProxyPreserveHost On
  ProxyPass        / http://phpmyadmin:80/
  ProxyPassReverse / http://phpmyadmin:80/
</VirtualHost>
